name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Keeps job-hunt-portal's master_profile (used by the tailor_job MCP tool
      # for CV drafting) and its job/gig ranking-keyword lists in sync with this
      # portfolio automatically. If this step fails, the Pages deploy above has
      # already succeeded regardless — this only means the portal is stale
      # until someone re-runs scripts/sync_master_profile.py by hand.
      - name: Sync job-hunt-portal (master_profile + ranking keywords)
        run: |
          curl -sf -X POST "https://20-207-202-52.sslip.io/webhook/sync-portfolio" \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_SYNC_SECRET }}" \
            --max-time 60
